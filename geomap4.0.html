<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVisor Perú Pro - Geología 100k</title>
    
    <!-- Tailwind CSS para Estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 0; }
        
        /* Estilos personalizados para Popups de Leaflet */
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .leaflet-popup-content { margin: 0 !important; }
        
        /* Animación de carga */
        .custom-loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #ef4444;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden">
    <div id="root"></div>

    <!-- Dependencias Externas -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const INGEMMET_REST_URL = 'https://geocatmin.ingemmet.gob.pe/arcgis/rest/services/SERV_GEOLOGIA_100K_INTEGRADA/MapServer';

        // Utilidad de consulta con Multi-Proxy y Resiliencia
        const fetchWithResilience = async (url, timeoutMs = 10000) => {
            const proxies = [
                (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}&_t=${Date.now()}`,
                (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
                (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
            ];

            let lastError = null;
            for (const proxyFn of proxies) {
                try {
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), timeoutMs);
                    const response = await fetch(proxyFn(url), { 
                        signal: controller.signal,
                        headers: { 'Accept': 'application/json' }
                    });
                    clearTimeout(id);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    return typeof data === 'string' ? JSON.parse(data) : data;
                } catch (err) {
                    lastError = err;
                }
            }
            throw lastError || new Error('Falla de conexión');
        };

        function App() {
            const mapRef = useRef(null);
            const markerRef = useRef(null);
            const [isLocating, setIsLocating] = useState(false);
            const [error, setError] = useState(null);
            const [activeBaseLayer, setActiveBaseLayer] = useState('osm');
            const [searchQuery, setSearchQuery] = useState('');
            const [suggestions, setSuggestions] = useState([]);
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            const [isSearching, setIsSearching] = useState(false);
            const [isMovementEnabled, setIsMovementEnabled] = useState(true);

            // Componente de Icono Lucide
            const Icon = ({ name, className = "w-4 h-4" }) => {
                useEffect(() => { lucide.createIcons(); }, []);
                return <i data-lucide={name} className={className}></i>;
            };

            // Buscador con Debounce
            useEffect(() => {
                if (searchQuery.length < 3) {
                    setSuggestions([]);
                    setIsDropdownOpen(false);
                    return;
                }
                const timer = setTimeout(async () => {
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&countrycodes=pe&limit=5`);
                        const data = await response.json();
                        setSuggestions(data);
                        setIsDropdownOpen(true);
                    } catch (e) {}
                }, 300);
                return () => clearTimeout(timer);
            }, [searchQuery]);

            // Consulta de Unidad Geológica
            const fetchGeologyInfo = useCallback(async (latlng) => {
                if (!mapRef.current) return;
                const bounds = mapRef.current.getBounds();
                const sw = bounds.getSouthWest();
                const ne = bounds.getNorthEast();

                const params = new URLSearchParams({
                    geometry: `${latlng.lng},${latlng.lat}`,
                    geometryType: 'esriGeometryPoint',
                    sr: '4326',
                    layers: 'all',
                    tolerance: '5',
                    mapExtent: `${sw.lng - 0.01},${sw.lat - 0.01},${ne.lng + 0.01},${ne.lat + 0.01}`,
                    imageDisplay: '800,600,96',
                    f: 'json'
                });

                try {
                    const data = await fetchWithResilience(`${INGEMMET_REST_URL}/identify?${params.toString()}`);
                    if (data.results && data.results.length > 0) {
                        const res = data.results.find(r => r.attributes.UNIDAD || r.attributes.NM_UNIDAD);
                        if (res) {
                            const unidad = res.attributes.UNIDAD || res.attributes.NM_UNIDAD || 'N/A';
                            return `
                                <div class="p-3 min-w-[180px] bg-white">
                                    <h3 class="font-bold text-red-600 border-b border-red-100 mb-2 pb-1 text-[10px] uppercase italic">Unidad Geológica</h3>
                                    <p class="text-xs text-slate-800 font-semibold leading-tight">${unidad}</p>
                                    <div class="mt-2 pt-1 border-t border-slate-100 text-[7px] text-slate-400 font-bold uppercase">Fuente: INGEMMET 100k</div>
                                </div>
                            `;
                        }
                    }
                    return `<div class="p-3 text-xs text-center">Sin datos en este punto</div>`;
                } catch (e) { return `<div class="p-2 text-xs italic">Error de conexión</div>`; }
            }, []);

            // Control de Bloqueo de Movimiento
            useEffect(() => {
                if (!mapRef.current) return;
                const map = mapRef.current;
                const actions = ['dragging', 'touchZoom', 'doubleClickZoom', 'scrollWheelZoom', 'boxZoom', 'keyboard'];
                actions.forEach(a => isMovementEnabled ? map[a].enable() : map[a].disable());
            }, [isMovementEnabled]);

            // Inicialización del Mapa
            useEffect(() => {
                const map = L.map('map', { center: [-9.19, -75.01], zoom: 6, zoomControl: false });
                mapRef.current = map;

                const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' }).addTo(map);
                const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });
                const geology = L.tileLayer('https://geocatmin.ingemmet.gob.pe/arcgis/rest/services/SERV_GEOLOGIA_100K_INTEGRADA/MapServer/tile/{z}/{y}/{x}', { attribution: 'INGEMMET', opacity: 0.8, maxZoom: 19 });

                L.control.layers({ "Calles": osm, "Satélite": satellite, "Geología 100k": geology }, {}, { position: 'topright', collapsed: false }).addTo(map);
                L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);
                L.control.zoom({ position: 'topleft' }).addTo(map);

                map.on('baselayerchange', e => {
                    if (e.name === "Geología 100k") setActiveBaseLayer('geology');
                    else setActiveBaseLayer('osm');
                });

                map.on('click', async e => {
                    if (map.hasLayer(geology)) {
                        const content = await fetchGeologyInfo(e.latlng);
                        if (content) L.popup().setLatLng(e.latlng).setContent(content).openOn(map);
                    }
                });

                return () => map.remove();
            }, [fetchGeologyInfo]);

            const handleLocate = () => {
                setIsLocating(true);
                navigator.geolocation.getCurrentPosition(async (p) => {
                    const coords = [p.coords.latitude, p.coords.longitude];
                    mapRef.current.flyTo(coords, 16);
                    if (markerRef.current) markerRef.current.remove();
                    markerRef.current = L.marker(coords).addTo(mapRef.current);
                    setIsLocating(false);
                }, () => { setError('Error de ubicación'); setIsLocating(false); });
            };

            return (
                <div className="relative h-screen w-full">
                    <div id="map"></div>

                    {/* Buscador */}
                    <div className="absolute bottom-[136px] left-4 z-[1010] w-[250px]">
                        <div className="bg-white/90 backdrop-blur-md shadow-xl rounded-xl border border-slate-200 flex items-center p-1 gap-1">
                            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Buscar en Perú..." className="flex-1 bg-transparent border-none outline-none px-2 py-1 text-[11px]" />
                            <button className="bg-red-600 text-white p-1.5 rounded-lg">
                                {isSearching ? <div className="custom-loader"></div> : <Icon name="search" className="w-3.5 h-3.5" />}
                            </button>
                        </div>
                        {isDropdownOpen && suggestions.length > 0 && (
                            <ul className="absolute bottom-full mb-2 w-full bg-white shadow-2xl rounded-xl border border-slate-200 overflow-hidden">
                                {suggestions.map((s, i) => (
                                    <li key={i} onClick={() => { 
                                        const coords = [s.lat, s.lon];
                                        mapRef.current.flyTo(coords, 14);
                                        setSearchQuery(s.display_name);
                                        setIsDropdownOpen(false);
                                    }} className="px-3 py-2 text-[10px] hover:bg-red-50 cursor-pointer border-b border-slate-100">{s.display_name}</li>
                                ))}
                            </ul>
                        )}
                    </div>

                    {/* Cabecera Inferior */}
                    <header className="absolute bottom-4 left-4 z-[1000] bg-white/90 backdrop-blur-md shadow-xl rounded-xl border border-slate-200 flex items-center px-3 gap-3 w-[250px] h-[42px]">
                        <div className="bg-red-600 rounded-lg w-[30px] h-[30px] flex items-center justify-center text-white"><Icon name="layers" /></div>
                        <div>
                            <h1 className="text-slate-900 font-bold text-[11px]">GeoVisor Perú Pro</h1>
                            <p className="text-slate-500 text-[9px] uppercase font-medium">Geología 100k - INGEMMET</p>
                        </div>
                    </header>

                    {/* Botones de Acción */}
                    <div className="absolute bottom-[110px] right-4 z-[1000] flex flex-col gap-3">
                        <button onClick={() => setIsMovementEnabled(!isMovementEnabled)} className={`flex items-center gap-2 p-2.5 rounded-full shadow-xl transition-all ${isMovementEnabled ? 'bg-white text-slate-600' : 'bg-slate-800 text-white'}`}>
                            <Icon name={isMovementEnabled ? 'move' : 'lock'} />
                            <span className="text-[9px] font-bold uppercase">{isMovementEnabled ? 'Móvil' : 'Bloqueado'}</span>
                        </button>
                        <button onClick={handleLocate} className="bg-red-600 text-white flex items-center gap-2 p-2.5 rounded-full shadow-xl">
                            {isLocating ? <div className="custom-loader !border-white"></div> : <Icon name="navigation" />}
                            <span className="text-[9px] font-bold uppercase">Ubicarme</span>
                        </button>
                    </div>

                    {/* Indicador de Modo */}
                    <div className="absolute bottom-[64px] left-4 z-[1000] bg-white/90 px-3 py-1.5 rounded-full text-[9px] font-bold uppercase border border-slate-200 shadow-lg flex items-center gap-2">
                        <div className={`w-1.5 h-1.5 rounded-full ${activeBaseLayer === 'geology' ? 'bg-red-500' : 'bg-slate-400'}`} />
                        {activeBaseLayer === 'geology' ? 'Modo Geológico' : 'Modo Calles'}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
